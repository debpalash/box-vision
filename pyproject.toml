[project]
name = "boxvision"
version = "0.1.0"
description = "Lightweight CPU-optimized class-agnostic bounding box detector"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "tqdm>=4.65.0",
    "pycocotools>=2.0.7",
    "albumentations>=1.3.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "onnxscript>=0.7.0",
]

[project.scripts]
boxvision = "boxvision.cli:main"
