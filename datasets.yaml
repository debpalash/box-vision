# BoxVision dataset registry
#
# Each entry describes one dataset. The CLI / training code resolves names to
# concrete paths via boxvision.registry.load_dataset(name).
#
# Schema:
#   <name>:
#     format: coco | yolo                   # which loader to use
#     root:   path                          # relative to project root (or absolute)
#     class_agnostic: true | false          # collapse all classes to one "object"
#     description: free text                # for `boxvision datasets` listing
#     license: free text                    # for attribution / weights provenance
#     splits:
#       train:
#         images: path (relative to root)
#         annotations: path (relative to root)  # COCO format
#         labels: path (relative to root)       # YOLO format (mutually exclusive)
#       val:   { ... }
#       test:  { ... }                      # optional

road-signs:
  format: coco
  root: datasets/coco
  class_agnostic: true
  description: Roboflow road-signs v2 — 21 sign types collapsed into one "object" class (BoxVision is class-agnostic by design)
  license: CC BY 4.0
  source: https://universe.roboflow.com/roboflow-100/road-signs-6ih4y
  splits:
    train:
      images: train
      annotations: train/_annotations.coco.json
    val:
      images: valid
      annotations: valid/_annotations.coco.json
    test:
      images: test
      annotations: test/_annotations.coco.json

road-signs-multiclass:
  format: coco
  root: datasets/coco
  class_agnostic: false
  description: Same data, 21 distinct sign classes (kept around for multi-class ablations; not the default)
  license: CC BY 4.0
  source: https://universe.roboflow.com/roboflow-100/road-signs-6ih4y
  splits:
    train:
      images: train
      annotations: train/_annotations.coco.json
    val:
      images: valid
      annotations: valid/_annotations.coco.json
    test:
      images: test
      annotations: test/_annotations.coco.json

shapes:
  format: coco
  root: datasets/shapes
  class_agnostic: true
  description: Label Studio export (project-615) — arrow/box/line shapes collapsed to single "object" class for class-agnostic detection
  license: (user-provided)
  source: Label Studio project-615
  splits:
    train:
      images: train
      annotations: train/_annotations.coco.json
    val:
      images: valid
      annotations: valid/_annotations.coco.json

shapes-distilled:
  format: coco
  root: datasets/shapes-distilled
  class_agnostic: true
  description: shapes train split augmented with G@416 teacher pseudo-labels (+48% extra boxes); valid mirrors shapes valid for apples-to-apples eval
  license: (user-provided)
  source: distill_pseudo_labels.py from runs/G-aug-300ep/best.pt (conf=0.40, iou-with-gt=0.5)
  splits:
    train:
      images: train
      annotations: train/_annotations.coco.json
    val:
      images: valid
      annotations: valid/_annotations.coco.json

road-signs-distilled:
  format: coco
  root: datasets/road-signs-distilled
  class_agnostic: true
  description: road-signs train split augmented with rs-teacher-416 pseudo-labels (~+18% extra boxes); valid mirrors road-signs valid for apples-to-apples eval
  license: CC BY 4.0
  source: distill_pseudo_labels.py from runs/rs-teacher-416-200ep/best.pt (conf=0.40, iou-with-gt=0.5)
  splits:
    train:
      images: train
      annotations: train/_annotations.coco.json
    val:
      images: valid
      annotations: valid/_annotations.coco.json

road-signs-2k:
  format: coco
  root: datasets/road-signs-2k
  class_agnostic: true
  description: road-signs train+val+test merged into one pool (2093 imgs), random 90/10 train/val split with seed=42 — larger training signal for KD experiments
  license: CC BY 4.0
  source: scripts/build_road_signs_2k.py from datasets/coco/{train,valid,test}
  splits:
    train:
      images: train
      annotations: train/_annotations.coco.json
    val:
      images: valid
      annotations: valid/_annotations.coco.json

road-signs-2k-distilled:
  format: coco
  root: datasets/road-signs-2k-distilled
  class_agnostic: true
  description: road-signs-2k train split augmented with rs-teacher-2k pseudo-labels; valid mirrors road-signs-2k valid (209 imgs)
  license: CC BY 4.0
  source: distill_pseudo_labels.py on road-signs-2k
  splits:
    train:
      images: train
      annotations: train/_annotations.coco.json
    val:
      images: valid
      annotations: valid/_annotations.coco.json

road-signs-yolo:
  format: yolo
  root: datasets/yolo26
  class_agnostic: true
  description: Same road-signs data in YOLO TXT format (Ultralytics ecosystem)
  license: CC BY 4.0
  source: https://universe.roboflow.com/roboflow-100/road-signs-6ih4y
  splits:
    train:
      images: train/images
      labels: train/labels
    val:
      images: valid/images
      labels: valid/labels
    test:
      images: test/images
      labels: test/labels

